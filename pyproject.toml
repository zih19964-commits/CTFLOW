[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctflow"
version = "0.1.0"
description = "用可复用 Worker 和依赖图编排 AI 任务的本地终端工作台"
requires-python = ">=3.11"
dependencies = [
    "textual>=6.0,<7",
    "rich>=14.0,<15",
    "openai>=2.0,<3",
    "mcp>=1.0,<2",
    "keyring>=25,<27",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
ctflow = "ctflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctflow = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
